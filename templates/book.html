{% extends "base.html" %}{% block title %}Đặt bàn | K&K{% endblock %}{% block content %}<section class="pagehero small"><div class="container"><div class="eyebrow">RESERVATION</div><h1>Đặt bàn tại K&K</h1><p>Gửi yêu cầu, K&K sẽ xác nhận lại.</p></div></section><section class="section"><div class="container narrow panel"><form id="book"><label>Họ tên *<input name="name" required></label><label>Số điện thoại *<input name="phone" required></label><div class="two"><label>Ngày *<input name="booking_date" type="date" required></label><label>Giờ *<input name="booking_time" type="time" required></label></div><label>Số khách *<input name="guests" type="number" min="1" value="2" required></label><label>Ghi chú<textarea name="note" rows="3"></textarea></label><button type="submit" class="btn red full">Gửi yêu cầu đặt bàn</button><div id="bm"></div></form></div></section><script>
(function(){
  const form=document.getElementById('book');
  if(!form)return;
  const btn=form.querySelector('button[type="submit"]');
  const box=document.getElementById('bm');
  const newKey=()=>window.crypto?.randomUUID?.() || ('booking-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  // One idempotency key belongs to one booking attempt. It is deliberately
  // reused after an unknown/network failure so a retry cannot create a second booking.
  let idempotencyKey=newKey();
  form.onsubmit=async e=>{
    e.preventDefault();
    if(btn?.disabled)return;
    const o=Object.fromEntries(new FormData(form));
    o.idempotency_key=idempotencyKey;
    if(btn)btn.disabled=true;
    try{
      const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':idempotencyKey},body:JSON.stringify(o)});
      const d=await r.json();
      if(d.ok){
        // Replace the form page so refresh/back navigation cannot resubmit the POST.
        window.location.replace('/booking-success?booking_id='+encodeURIComponent(d.booking_id));
        return;
      }
      box.innerHTML='<div class="notice notice-error"><span class="notice-icon">!</span><div><b>Chưa thể gửi yêu cầu</b><span>'+escapeHtml(d.message||'Không thể gửi yêu cầu.')+'</span></div></div>';
      if(btn)btn.disabled=false;
    }catch(err){
      box.innerHTML='<div class="notice notice-error"><span class="notice-icon">!</span><div><b>Chưa thể gửi yêu cầu</b><span>Không thể kết nối máy chủ. Vui lòng thử lại.</span></div></div>';
      if(btn)btn.disabled=false;
    }
  };
})();
</script>{% endblock %}
