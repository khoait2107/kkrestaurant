{% extends "base.html" %}{% block title %}Đặt bàn | K&K{% endblock %}{% block content %}<section class="pagehero small"><div class="container"><div class="eyebrow">RESERVATION</div><h1>Đặt bàn tại K&K</h1><p>Gửi yêu cầu, K&K sẽ xác nhận lại.</p></div></section><section class="section"><div class="container narrow panel"><form id="book"><label>Họ tên *<input name="name" required></label><label>Số điện thoại *<input name="phone" required></label><div class="two"><label>Ngày *<input name="booking_date" type="date" required></label><label>Giờ *<input name="booking_time" type="time" required></label></div><label>Số khách *<input name="guests" type="number" min="1" value="2" required></label><label>Ghi chú<textarea name="note" rows="3"></textarea></label><button class="btn red full">Gửi yêu cầu đặt bàn</button><div id="bm"></div></form></div></section><script>document.getElementById('book').onsubmit=async e=>{e.preventDefault();const form=e.target,btn=form.querySelector('button[type="submit"]'),box=document.getElementById('bm');const o=Object.fromEntries(new FormData(form));if(btn)btn.disabled=true;try{const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}),d=await r.json();box.innerHTML=d.ok?`<div class="notice notice-success"><span class="notice-icon">✓</span><div>Đã nhận yêu cầu đặt bàn #${escapeHtml(d.booking_id)}. K&K sẽ liên hệ xác nhận.</div></div>`:`<div class="notice notice-error"><span class="notice-icon">!</span><div><b>Chưa thể gửi yêu cầu</b><span>${escapeHtml(d.message||'Không thể gửi yêu cầu.')}</span></div></div>`}catch(err){box.innerHTML='<div class="notice notice-error"><span class="notice-icon">!</span><div><b>Chưa thể gửi yêu cầu</b><span>Không thể kết nối máy chủ. Vui lòng thử lại.</span></div></div>'}finally{if(btn)btn.disabled=false}}</script>{% endblock %}
