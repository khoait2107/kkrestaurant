{% extends "base.html" %}{% block content %}<section class="admin-login"><form class="panel" method="post" action="/admin/login"><input type="hidden" name="_csrf" value="{{ admin_csrf_token }}"><div class="logo big">K<span>&</span>K</div><h1>Quản trị K&K</h1>{% if error %}<div class="notice notice-error"><span class="notice-icon">!</span><div><b>Đăng nhập không thành công</b><span>{{error}}</span></div></div>{% endif %}<label>Tài khoản<input name="username" value="{{ request.form.get("username","admin") }}"></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="btn red full">Đăng nhập</button><p class="muted">Tài khoản quản trị được thiết lập bảo mật trong file <code>.env</code> lần đầu.</p></form></section>{% endblock %}
